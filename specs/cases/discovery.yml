# Conformance cases of the discovery, run by the Python and the TypeScript implementations.
#
# Each case builds `tree` below a top, then runs one request and compares the outcome with
# `expect`. Every path of `tree`, `cwd` and `expect` is relative to the top; `start`, `root`,
# `config` and the values of `environ` are relative to `cwd`, as a command line gives them. A value
# of `tree` is the content of the file. `expect.table` is the table of the tool read from
# `pyproject.toml`, and null for any other place. A case whose request sets `pyproject` runs in
# Python only, since the TypeScript implementation serves tools written in TypeScript.
#
# Each runner runs every case twice. The first run builds the tree in an empty temporary folder and
# reads it through the local file system. The second run serves the tree from memory through the
# port of the files, below a top absent from the disk, so that a case expecting a file fails when a
# read bypasses the port.
#
# The tool name `probe` keeps the search above the top from meeting a real configuration file.

_schema: hodegos:cases@1

defaults:
  request:
    tool: probe
    extensions: [yml]
    pyproject: false
    stacked: false
    cwd: project
    start: null
    root: null
    config: null
    environ: {}

cases:
  # --- Places at the root -------------------------------------------------------------------------

  - name: root-file
    description: the file named after the tool, at the root, is found from a subfolder
    tree:
      project/probe.yml: "key: value\n"
      project/notes/a.md: ""
    request: {cwd: project/notes}
    expect: {root: project, configuration: project/probe.yml, table: null}

  - name: dot-config
    description: the file in the folder .config of the root is found
    tree:
      project/.config/probe.yml: ""
    expect: {root: project, configuration: project/.config/probe.yml, table: null}

  - name: config-folder
    description: the file in the folder config of the root is found
    tree:
      project/config/probe.yml: ""
      project/docs/a.md: ""
    request: {cwd: project/docs}
    expect: {root: project, configuration: project/config/probe.yml, table: null}

  - name: config-folder-of-other-tools
    description: a folder config holding only the files of other tools holds no configuration
    tree:
      project/probe.yml: ""
      project/config/other.yml: ""
      project/sub/config/other.yml: ""
      project/sub/a.md: ""
    request: {cwd: project/sub}
    expect: {root: project, configuration: project/probe.yml, table: null}

  - name: config-subfolder-not-searched
    description: a folder below config is not searched, whatever its name
    tree:
      project/config/tools/probe.yml: ""
    expect: {root: project, configuration: null, table: null}

  - name: second-extension
    description: each extension that the tool admits is searched
    tree:
      project/probe.toml: ""
    request: {extensions: [yml, toml]}
    expect: {root: project, configuration: project/probe.toml, table: null}

  - name: other-extension-ignored
    description: an extension that the tool does not admit is not searched
    tree:
      project/probe.toml: ""
    expect: {root: project, configuration: null, table: null}

  - name: folder-named-like-the-file
    description: a folder bearing the name of the file is not a configuration
    tree:
      project/probe.yml/a.txt: ""
    expect: {root: project, configuration: null, table: null}

  # --- The table of pyproject.toml ----------------------------------------------------------------

  - name: pyproject-table
    description: the table tool.probe of pyproject.toml is found, with its content
    tree:
      project/pyproject.toml: "[project]\nname = \"x\"\n\n[tool.probe]\nkey = \"value\"\n"
      project/src/a.py: ""
    request: {pyproject: true, cwd: project/src}
    expect: {root: project, configuration: project/pyproject.toml, table: {key: value}}

  - name: pyproject-without-table
    description: a pyproject.toml without the table of the tool is not a configuration
    tree:
      project/pyproject.toml: "[tool.other]\nkey = 1\n"
    request: {pyproject: true}
    expect: {root: project, configuration: null, table: null}

  - name: pyproject-not-read
    description: a tool that does not read pyproject.toml ignores its table
    tree:
      project/pyproject.toml: "[tool.probe]\nkey = 1\n"
    expect: {root: project, configuration: null, table: null}

  - name: pyproject-invalid
    description: a pyproject.toml that does not parse is reported
    tree:
      project/pyproject.toml: "[tool.probe\n"
    request: {pyproject: true}
    expect: {error: invalid-pyproject}

  # --- Competing places ---------------------------------------------------------------------------

  - name: competing-root-and-dot-config
    description: two places holding a file is an error, whatever the places
    tree:
      project/probe.yml: ""
      project/.config/probe.yml: ""
    expect: {error: competing-places}

  - name: competing-root-and-config
    description: the folder config competes with the root
    tree:
      project/probe.yml: ""
      project/config/probe.yml: ""
    expect: {error: competing-places}

  - name: competing-dot-config-and-config
    description: the folder config competes with the folder .config
    tree:
      project/.config/probe.yml: ""
      project/config/probe.yml: ""
    expect: {error: competing-places}

  - name: competing-config-and-pyproject
    description: the folder config competes with the table of pyproject.toml
    tree:
      project/config/probe.yml: ""
      project/pyproject.toml: "[tool.probe]\nkey = 1\n"
    request: {pyproject: true}
    expect: {error: competing-places}

  - name: competing-extensions
    description: two extensions of one place compete
    tree:
      project/probe.yml: ""
      project/probe.toml: ""
    request: {extensions: [yml, toml]}
    expect: {error: competing-places}

  - name: competing-file-and-pyproject
    description: the table of pyproject.toml competes with a file
    tree:
      project/probe.yml: ""
      project/pyproject.toml: "[tool.probe]\nkey = 1\n"
    request: {pyproject: true}
    expect: {error: competing-places}

  # --- The root -----------------------------------------------------------------------------------

  - name: no-configuration
    description: without any configuration, the root is the current folder
    tree:
      project/notes/a.md: ""
    request: {cwd: project/notes}
    expect: {root: project/notes, configuration: null, table: null}

  - name: nearest-ancestor
    description: the nearest folder holding a configuration is the root
    tree:
      project/probe.yml: ""
      project/sub/probe.yml: ""
      project/sub/deep/a.md: ""
    request: {cwd: project/sub/deep}
    expect: {root: project/sub, configuration: project/sub/probe.yml, table: null}

  - name: stacked-outermost
    description: a tool that stacks one file per folder takes the outermost folder
    tree:
      project/probe.yml: ""
      project/sub/probe.yml: ""
      project/sub/deep/a.md: ""
    request: {cwd: project/sub/deep, stacked: true}
    expect: {root: project, configuration: project/probe.yml, table: null}

  - name: ancestor-found-through-config
    description: the search of the root also finds a file in the folder config
    tree:
      project/config/probe.yml: ""
      project/a/b/c.md: ""
    request: {cwd: project/a/b}
    expect: {root: project, configuration: project/config/probe.yml, table: null}

  - name: ancestor-pyproject-invalid
    description: an invalid pyproject.toml met by the search of the root is reported
    tree:
      project/pyproject.toml: "[tool.probe\n"
      project/a/b.md: ""
    request: {pyproject: true, cwd: project/a}
    expect: {error: invalid-pyproject}

  - name: search-stops-at-nearest
    description: the search of the root reads no folder above the nearest root
    tree:
      pyproject.toml: "[tool.probe\n"
      project/probe.yml: ""
      project/a/b.md: ""
    request: {pyproject: true, cwd: project/a}
    expect: {root: project, configuration: project/probe.yml, table: null}

  - name: stacked-search-reads-every-folder
    description: the search of a stacked tool reads every folder up to the top
    tree:
      pyproject.toml: "[tool.probe\n"
      project/probe.yml: ""
      project/a/b.md: ""
    request: {pyproject: true, cwd: project/a, stacked: true}
    expect: {error: invalid-pyproject}

  - name: root-option
    description: the root option wins over the search
    tree:
      project/probe.yml: ""
      other/probe.yml: ""
    request: {root: ../other}
    expect: {root: other, configuration: other/probe.yml, table: null}

  - name: root-option-without-configuration
    description: a root given by option may hold no configuration
    tree:
      project/probe.yml: ""
      other/a.md: ""
    request: {root: ../other}
    expect: {root: other, configuration: null, table: null}

  - name: root-variable
    description: the variable <TOOL>_ROOT names the root when no option does
    tree:
      project/probe.yml: ""
      other/probe.yml: ""
    request: {environ: {PROBE_ROOT: ../other}}
    expect: {root: other, configuration: other/probe.yml, table: null}

  - name: root-option-over-variable
    description: the root option wins over the variable
    tree:
      project/probe.yml: ""
      other/probe.yml: ""
      third/probe.yml: ""
    request: {root: ../third, environ: {PROBE_ROOT: ../other}}
    expect: {root: third, configuration: third/probe.yml, table: null}

  - name: root-variable-empty
    description: an empty variable counts as unset
    tree:
      project/probe.yml: ""
    request: {environ: {PROBE_ROOT: ""}}
    expect: {root: project, configuration: project/probe.yml, table: null}

  - name: root-variable-hyphen
    description: a hyphen of the tool name becomes an underscore in the variable
    tree:
      project/a.md: ""
      other/probe-tool.yml: ""
    request: {tool: probe-tool, environ: {PROBE_TOOL_ROOT: ../other}}
    expect: {root: other, configuration: other/probe-tool.yml, table: null}

  # --- The start of the search --------------------------------------------------------------------

  - name: start-below-current
    description: the search of the root begins at the start, below the current folder
    tree:
      project/probe.yml: ""
      project/src/probe.yml: ""
      project/src/lib/a.py: ""
    request: {start: src/lib}
    expect: {root: project/src, configuration: project/src/probe.yml, table: null}

  - name: start-above-current
    description: the search of the root begins at the start, above the current folder
    tree:
      project/probe.yml: ""
      project/build/probe.yml: ""
    request: {cwd: project/build, start: ..}
    expect: {root: project, configuration: project/probe.yml, table: null}

  - name: start-fallback-is-current
    description: without a configuration above the start, the root is the current folder
    tree:
      project/a.md: ""
      elsewhere/src/a.py: ""
    request: {start: ../elsewhere/src}
    expect: {root: project, configuration: null, table: null}

  - name: start-below-with-root-option
    description: the root option resolves against the current folder, not against the start
    tree:
      other/probe.yml: ""
      project/other/probe.yml: ""
      project/src/a.py: ""
    request: {start: src, root: ../other}
    expect: {root: other, configuration: other/probe.yml, table: null}

  - name: start-below-with-root-variable
    description: the variable resolves against the current folder, not against the start
    tree:
      other/probe.yml: ""
      project/other/probe.yml: ""
      project/src/a.py: ""
    request: {start: src, environ: {PROBE_ROOT: ../other}}
    expect: {root: other, configuration: other/probe.yml, table: null}

  - name: start-above-with-root-option
    description: a start above the current folder leaves the root option to the current folder
    tree:
      project/other/probe.yml: ""
      project/build/other/probe.yml: ""
    request: {cwd: project/build, start: .., root: other}
    expect: {root: project/build/other, configuration: project/build/other/probe.yml, table: null}

  - name: start-above-with-root-variable
    description: a start above the current folder leaves the variable to the current folder
    tree:
      project/other/probe.yml: ""
      project/build/other/probe.yml: ""
    request: {cwd: project/build, start: .., environ: {PROBE_ROOT: other}}
    expect: {root: project/build/other, configuration: project/build/other/probe.yml, table: null}

  - name: start-stacked
    description: the search of a stacked tool begins at the start, and takes the outermost folder
    tree:
      project/probe.yml: ""
      project/src/probe.yml: ""
      elsewhere/a.md: ""
    request: {cwd: elsewhere, start: ../project/src, stacked: true}
    expect: {root: project, configuration: project/probe.yml, table: null}

  - name: start-with-config-option
    description: the configuration option resolves against the current folder, not the start
    tree:
      project/probe.yml: ""
      project/src/probe.yml: ""
    request: {start: src, config: probe.yml}
    expect: {root: project/src, configuration: project/probe.yml, table: null}

  # --- The configuration option -------------------------------------------------------------------

  - name: config-option
    description: the configuration option names the file, and the root is resolved as usual
    tree:
      project/probe.yml: ""
      elsewhere/custom.yml: ""
    request: {config: ../elsewhere/custom.yml}
    expect: {root: project, configuration: elsewhere/custom.yml, table: null}

  - name: config-option-skips-competition
    description: the configuration option is read even where two places compete
    tree:
      project/probe.yml: ""
      project/.config/probe.yml: ""
    request: {config: probe.yml}
    expect: {root: project, configuration: project/probe.yml, table: null}

  - name: config-option-missing
    description: a configuration option that names no file is an error
    tree:
      project/a.md: ""
    request: {config: absent.yml}
    expect: {error: missing-config}

  # --- Invalid requests ---------------------------------------------------------------------------

  - name: tool-name-invalid
    description: a tool name holds lowercase letters, digits and inner hyphens only
    tree:
      project/a.md: ""
    request: {tool: Probe}
    expect: {error: invalid-request}

  - name: extensions-empty
    description: a tool admits at least one extension
    tree:
      project/a.md: ""
    request: {extensions: []}
    expect: {error: invalid-request}

  - name: extension-invalid
    description: an extension is given without its dot
    tree:
      project/a.md: ""
    request: {extensions: [.yml]}
    expect: {error: invalid-request}
